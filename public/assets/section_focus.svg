<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background from Carbon -->
  <rect width="1200" height="600" fill="#050505" />
  
  <defs>
    <pattern id="chevronPatternFocus" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 10 10 L 20 20 L 10 30" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.08" />
    </pattern>
  </defs>

  <rect width="1200" height="550" fill="url(#chevronPatternFocus)" />
  
  <!-- Terminal Session Text from Session (Background noise) -->
  <g font-family="'JetBrains Mono', monospace" font-size="10" fill="white" opacity="0.03">
    <text x="20" y="55">JOSEPH@linux:~$ whoami</text>
    <text x="20" y="75">mark_joseph</text>
    <text x="20" y="95">JOSEPH@linux:~$ ls -la ~/projects</text>
    <text x="20" y="115">total 42</text>
    <text x="20" y="135">drwxr-xr-x  2 JOSEPH JOSEPH 4096 Oct  9 08:00 .</text>
    <text x="20" y="155">drwxr-xr-x  3 JOSEPH JOSEPH 4096 Oct  9 08:00 ..</text>
    <text x="20" y="175">drwxr-xr-x  6 JOSEPH JOSEPH 4096 Oct  9 08:00 hen-stress-detection</text>
    <text x="20" y="195">drwxr-xr-x  4 JOSEPH JOSEPH 4096 Oct  9 08:00 mental-health-chatbot</text>
    <text x="20" y="215">drwxr-xr-x  5 JOSEPH JOSEPH 4096 Oct  9 08:00 inventory-system</text>
    <text x="20" y="235">drwxr-xr-x  3 JOSEPH JOSEPH 4096 Oct  9 08:00 portfolio</text>
    <text x="20" y="255">JOSEPH@linux:~$ cat stack.txt</text>
    <text x="20" y="275">react node express flask fastapi pytorch langchain</text>
  </g>

  <!-- Terminal Top Bar -->
  <rect width="1200" height="40" fill="#000" />
  <g transform="translate(30, 20)">
    <circle cx="0" cy="0" r="6" fill="#ff5f56" />
    <circle cx="24" cy="0" r="6" fill="#ffbd2e" />
    <circle cx="48" cy="0" r="6" fill="#27c93f" />
  </g>
  <text x="600" y="25" text-anchor="middle" font-family="monospace" font-size="12" fill="white" opacity="0.3">JOSEPH@linux: ~</text>

  <!-- Animation Logic -->
  <!-- 
    Loop Duration: 8s
    0s - 1s: Idle prompt
    1s - 2.5s: Typing "man focus"
    2.5s - 3s: Wait
    3s: Switch to Man Page
    3s - 8s: Read Man Page
    8s: Reset
  -->

  <!-- Screen 1: Prompt -->
  <g id="prompt-screen" transform="translate(50, 80)">
    <!-- Visibility: Visible 0-3s, Hidden 3-8s -->
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.375;0.376;0.999;1" dur="8s" repeatCount="indefinite" />
    
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="24" fill="#27c93f">JOSEPH@linux:~$ <tspan fill="white">man stack</tspan></text>
    
    <!-- Masking rect for typing effect -->
    <rect x="225" y="0" width="165" height="30" fill="#050505" opacity="1">
       <animate attributeName="x" 
                values="225;225;239;253;267;281;295;309;323;337;351;365;365" 
                keyTimes="0;0.125;0.146;0.167;0.188;0.208;0.229;0.250;0.271;0.292;0.313;0.334;1" 
                dur="8s" 
                repeatCount="indefinite" 
                calcMode="discrete" />
    </rect>
    
    <!-- Cursor -->
    <rect x="225" y="0" width="12" height="24" fill="white">
        <animate attributeName="x" 
                 values="225;225;239;253;267;281;295;309;323;337;351;365;365" 
                 keyTimes="0;0.125;0.146;0.167;0.188;0.208;0.229;0.250;0.271;0.292;0.313;0.334;1" 
                 dur="8s" 
                 repeatCount="indefinite" 
                 calcMode="discrete" />
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Screen 2: Man Page -->
  <g id="man-page" transform="translate(50, 80)" opacity="0">
    <!-- Visibility: Hidden 0-3s, Visible 3-8s -->
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.375;0.376;0.999;1" dur="8s" repeatCount="indefinite" />

    <!-- Header -->
    <text x="0" y="10" font-family="monospace" font-size="24" fill="white" font-weight="bold">STACK(1)</text>
    <text x="500" y="10" font-family="monospace" font-size="24" fill="white" font-weight="bold" text-anchor="middle">JOSEPH Manual</text>
    <text x="1000" y="10" font-family="monospace" font-size="24" fill="white" font-weight="bold" text-anchor="end">STACK(1)</text>
    
    <!-- NAME Section -->
    <text x="0" y="50" font-family="monospace" font-size="22" fill="#6366f1" font-weight="bold">NAME</text>
    <text x="50" y="70" font-family="monospace" font-size="20" fill="white">stack - Mark Joseph's tech toolkit</text>
    
    <!-- SYNOPSIS Section -->
    <text x="0" y="100" font-family="monospace" font-size="22" fill="#6366f1" font-weight="bold">SYNOPSIS</text>
    <text x="50" y="120" font-family="monospace" font-size="20" fill="white">stck [option]</text>
    
<!-- DESCRIPTION Section -->
    <text x="0" y="150" font-family="monospace" font-size="22" fill="#6366f1" font-weight="bold">DESCRIPTION</text>
    <text x="50" y="170" font-family="monospace" font-size="20" fill="white">Core areas I work in:</text>
    
    <text x="70" y="200" font-family="monospace" font-size="20" fill="white" font-weight="bold">• AI &amp; MACHINE LEARNING</text>
    <text x="90" y="220" font-family="monospace" font-size="16" fill="white" opacity="0.8">Multi-modal models, YOLO, PyTorch, TensorFlow, Scikit-learn</text>
    
    <text x="70" y="240" font-family="monospace" font-size="20" fill="white" font-weight="bold">• FULL STACK WEB DEVELOPMENT</text>
    <text x="90" y="260" font-family="monospace" font-size="16" fill="white" opacity="0.8">React dashboards, Node.js, Express, and RESTful APIs</text>
    
    <text x="70" y="280" font-family="monospace" font-size="20" fill="white" font-weight="bold">• PYTHON BACKENDS</text>
    <text x="90" y="300" font-family="monospace" font-size="16" fill="white" opacity="0.8">Flask and FastAPI services that serve ML models</text>
    
    <text x="70" y="320" font-family="monospace" font-size="20" fill="white" font-weight="bold">• LLM &amp; CHATBOTS</text>
    <text x="90" y="340" font-family="monospace" font-size="16" fill="white" opacity="0.8">Local LLM chatbots with Ollama, Qwen, and LangChain</text>
    
    <text x="70" y="360" font-family="monospace" font-size="20" fill="white" font-weight="bold">• CLOUD &amp; DEPLOYMENT</text>
    <text x="90" y="380" font-family="monospace" font-size="16" fill="white" opacity="0.8">IT Specialist Cloud Computing, Render, Vercel, Git/GitHub</text>
    
    <text x="70" y="400" font-family="monospace" font-size="20" fill="white" font-weight="bold">• IT SUPPORT &amp; SYSTEMS</text>
    <text x="90" y="420" font-family="monospace" font-size="16" fill="white" opacity="0.8">Helpdesk, web servers, LAN setup, and workstation config</text>

    <!-- AUTHOR Section -->
    <text x="0" y="455" font-family="monospace" font-size="22" fill="#6366f1" font-weight="bold">AUTHOR</text>
    <text x="50" y="475" font-family="monospace" font-size="20" fill="white">Mark Joseph C. Trillana - markjoseph.vercel.app</text>
  </g>

  <!-- Bottom Status Bar -->
  <rect x="0" y="560" width="1200" height="40" fill="#000" />
  <text x="30" y="585" font-family="monospace" font-size="12" fill="#27c93f" opacity="0.6">λ SYST_OK</text>
  <text x="1170" y="585" text-anchor="end" font-family="monospace" font-size="12" fill="white" opacity="0.3">JOSEPH v1.2.0 | UTF-8 | LINUX_OSX_CORE</text>
</svg>
